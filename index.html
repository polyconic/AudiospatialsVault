<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Audiospatials Vault</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta name="description" content="Unreleased and unfinished work from Audiospatials, streaming around the clock.">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/vault.css">
    <style>
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body { background: var(--bg); position: relative; }

        /* The wordmark, drawn by geo.js over the link's own text, which stays
           as the hit area and for readers. It leads to the list. Five letters
           against the main sites' thirteen, so it's set larger to carry the same weight. */
        .mark {
            position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%);
            font-family: var(--sans); font-size: clamp(24px, 12vw, 280px); font-weight: 700;
            letter-spacing: 0.25em; text-transform: uppercase; white-space: nowrap;
            color: transparent; text-decoration: none; padding: 0.4em 0; z-index: 10; user-select: none;
        }
        .geo { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; }
        .kicker { position: absolute; left: 0; right: 0; text-align: center; z-index: 10; }

        /* The stream, under the word. */
        .stream { position: absolute; left: 50%; bottom: max(clamp(28px, 8vh, 80px), env(safe-area-inset-bottom));
                  transform: translateX(-50%); width: min(560px, calc(100% - 40px)); z-index: 10; }
        .stream > .label { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
        .stream .tracks { max-width: none; margin-bottom: 0; }
        .stream nav { margin-top: 18px; display: flex; justify-content: center; gap: 22px; }
        .stream nav a { color: var(--dim); text-decoration: none; transition: color 0.2s; }
        .stream nav a:hover, .stream nav a:focus-visible { color: var(--fg); }

        body { -webkit-touch-callout: none; }
    </style>
</head>
<body>
<div class="corner">
<a class="mailmark" href="mailto:hello@audiospatials.com?subject=Vault" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5H4L12 11.6 20 5H22V19H2Z"/></svg>
</a>
</div>

<p class="kicker label">Audiospatials</p>
<a class="mark" href="/tracklist" aria-label="Vault: the tracklist">VAULT</a>
<canvas class="geo" id="geo" aria-hidden="true"></canvas>

<div class="stream">
    <p class="label"><span class="onair">On air</span></p>
    <div class="tracks">
        <div class="track live"><button type="button" class="track-play" aria-label="Turn sound on"></button><div class="track-name"><a class="track-title" href="/tracklist"></a><span class="track-sub label"></span></div><span class="track-time label"></span><div class="track-bar" aria-hidden="true"><span></span></div></div>
    </div>
    <nav class="label"><a href="/tracklist">Tracklist</a><a href="https://audiospatials.com/">Audiospatials</a></nav>
</div>

<script src="/content/pieces.js"></script>
<script src="/js/geo.js"></script>
<script src="/js/vault.js"></script>
<script>
    const container = document.querySelector('.mark');
    const kicker = document.querySelector('.kicker');
    Geo.converge(document.getElementById('geo'), container.textContent, width => {
        const r = container.getBoundingClientRect();
        const s = Math.min(r.width / width, innerHeight * 0.16);
        const y = r.top + r.height / 2 - s / 2;
        kicker.style.top = (y - 20 - s * 0.25) + 'px';
        return { x: (innerWidth - width * s) / 2, y, s };
    }, { hold: 5, cycle: 21 });
</script>
</body>
</html>
