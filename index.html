<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Audiospatials Vault</title>
    <link rel="canonical" href="https://vault.audiospatials.com/">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta name="description" content="Unreleased and unfinished work from Audiospatials, streaming around the clock.">
    <meta property="og:title" content="Audiospatials Vault">
    <meta property="og:description" content="Unreleased and unfinished work from Audiospatials, streaming around the clock.">
    <meta property="og:image" content="https://vault.audiospatials.com/assets/share/vault.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vault.audiospatials.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/vault.css">
    <style>
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body { background: var(--bg); position: relative; }

        /* Clouds over a peak behind the trees, looping for everyone (muted; the
           stream is the sound). A tall cut from the 4K original for phones. */
        .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
              z-index: 0; pointer-events: none; }
        /* Keeps the words at the bottom readable over the lighter frames. */
        .shade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
                 background: linear-gradient(to bottom, rgba(10,10,10,0.15), rgba(10,10,10,0) 40%, rgba(10,10,10,0.55)); }

        /* The name, small, over the clouds; a big wordmark was too much over
           the video (Greg, 2026-09-29). */
        .kicker { position: absolute; left: 0; right: 0; top: 42%; transform: translateY(-50%);
                  margin: 0; text-align: center; z-index: 10;
                  color: var(--fg); text-shadow: 0 0 2px rgba(0,0,0,0.4), 0 1px 14px rgba(0,0,0,0.45); }

        /* The stream, at the bottom. */
        .stream { position: absolute; left: 50%; bottom: max(clamp(28px, 8vh, 80px), env(safe-area-inset-bottom));
                  transform: translateX(-50%); width: min(560px, calc(100% - 40px)); z-index: 10; }
        .stream > .label { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
        .stream .tracks { max-width: none; margin-bottom: 0; }
        .stream nav { margin-top: 18px; display: flex; justify-content: center; gap: 22px; }
        .stream nav a { color: var(--dim); text-decoration: none; transition: color 0.2s; }
        .stream nav a:focus-visible { color: var(--fg); }
        @media (hover: hover) { .stream nav a:hover { color: var(--fg); } }

        body { -webkit-touch-callout: none; }
    </style>
</head>
<body>
<div class="corner">
<a class="mailmark" href="mailto:hello@audiospatials.com?subject=Vault" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5H4L12 11.6 20 5H22V19H2Z"/></svg>
</a>
</div>

<video class="bg" autoplay muted loop playsinline preload="auto" poster="/video/clouds.jpg" aria-hidden="true">
    <source src="/video/clouds-tall.mp4" type="video/mp4" media="(max-aspect-ratio: 4/5)">
    <source src="/video/clouds.mp4" type="video/mp4">
</video>
<div class="shade"></div>

<a class="backmark" href="https://audiospatials.com/" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 4.5V10H21V14H12V19.5Z"/></svg></a>
<a class="homemark" href="https://audiospatials.com/" aria-label="Audiospatials"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 11.5H19V21H13.8V15H10.2V21H5V11.5H2Z"/></svg></a>

<p class="kicker label">Audiospatials Vault</p>

<div class="stream">
    <p class="label"><span class="onair">On air</span></p>
    <div class="tracks">
        <div class="track live"><button type="button" class="track-play" aria-label="Turn sound on"></button><div class="track-name"><a class="track-title" href="/tracklist"></a><span class="track-sub label"></span></div><span class="track-time label"></span><div class="track-bar" aria-hidden="true"><span></span></div></div>
    </div>
    <nav class="label"><a href="/tracklist">Tracklist</a><a href="https://audiospatials.com/">Audiospatials</a></nav>
</div>

<script>
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const v = document.querySelector('.bg'); v.removeAttribute('autoplay'); v.pause();
    }
</script>
<script>
    // Back goes wherever the visitor came from, the studio site or anywhere
    // else (Greg, 2026-09-29). Opened fresh, with nowhere to go back to, it
    // goes to audiospatials.com; home always does.
    document.querySelector('.backmark').addEventListener('click', e => {
        if (document.referrer && history.length > 1) { e.preventDefault(); history.back(); }
    });
</script>
<script src="/content/pieces.js"></script>
<script src="/js/vault.js"></script>
</body>
</html>
