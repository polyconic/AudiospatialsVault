<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Audiospatials Vault</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="vault.css">
<meta name="description" content="Unreleased and in-progress work, and what people make of it.">
</head>
<body>

<div class="wrap">

  <header class="mast">
    <span class="ember"></span>
    <a href="index.html">AUDIOSPATIALS VAULT</a>
    <span class="sp"></span>
    <nav>
      <a href="index.html">stream</a>
      <a href="vault.html">vault</a>
    </nav>
  </header>

  <main id="piece"></main>

  <div id="thread"></div>

  <footer class="foot">
    <a href="vault.html">everything in the vault</a>
    <a href="index.html">back to the stream</a>
  </footer>

</div>

<script src="config.js"></script>
<script>
  /* Loaded only when there is somewhere to talk to. On a site running in
     local mode this saves a CDN round trip that could never succeed. */
  if (CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"><\/script>');
  }
</script>
<script src="station.js"></script>
<script src="clock.js"></script>
<script src="db.js"></script>
<script src="threads.js"></script>
<script>
(() => {
  const slug  = new URLSearchParams(location.search).get("p") || "";
  const piece = PIECES[slug];
  const mount = document.getElementById("piece");

  const el = (t, c, x) => {
    const n = document.createElement(t);
    if (c) n.className = c;
    if (x != null) n.textContent = x;
    return n;
  };

  if (!piece) {
    document.title = "Not in the vault — Audiospatials Vault";
    mount.append(el("h1", "ptitle", "Not in the vault"));
    mount.append(el("p", "pnote",
      slug ? "Nothing here is called “" + slug + "”."
           : "No piece was named in the link."));
    const back = el("p", null);
    const a = el("a", null, "See everything in the vault");
    a.href = "vault.html";
    back.append(a);
    mount.append(back);
    return;
  }

  document.title = piece.title + " — Audiospatials Vault";

  mount.append(el("div", "kicker", piece.kind === "audio" ? "sound" : "image"));
  mount.append(el("h1", "ptitle", piece.title));

  const meta = el("div", "pmeta");
  meta.append(el("span", null, piece.artist));
  const st = el("span", "status", piece.status);
  st.dataset.s = piece.status;
  meta.append(st);
  mount.append(meta);

  /* The work itself. On the stream you get whatever is on at the time;
     here you get it on demand, which is the entire reason this half of
     the site exists. */
  if (piece.kind === "audio") {
    const au = el("audio");
    au.controls = true;
    au.preload  = "none";
    au.src      = piece.file;
    mount.append(au);
  } else {
    const img = el("img", "plate");
    img.src = piece.file;
    img.alt = piece.title + " — " + piece.artist;
    img.loading = "lazy";
    mount.append(img);
  }

  if (piece.note) mount.append(el("div", "pnote", piece.note));

  /* If this happens to be on air right now, say so — it is the one thing
     a permalink cannot tell you and the stream can. */
  function checkAir() {
    const existing = document.getElementById("nowbar");
    if (existing) existing.remove();

    const live = piece.kind === "audio" ? Clock.audioOnAir() : Clock.artOnAir();
    if (!live || live.slug !== piece.slug) return;

    const bar = el("div", "onair-now");
    bar.id = "nowbar";
    bar.append(el("span", "ember"));
    bar.append(el("span", null,
      piece.kind === "audio" ? "On air right now." : "On screen right now."));
    const a = el("a", null, "listen along");
    a.href = "index.html";
    a.textContent = piece.kind === "audio" ? "listen along" : "go to the stream";
    bar.append(a);
    mount.insertBefore(bar, mount.children[3]);
  }
  checkAir();
  setInterval(checkAir, 15000);

  Thread.mount(document.getElementById("thread"), piece.slug);
})();
</script>
</body>
</html>
